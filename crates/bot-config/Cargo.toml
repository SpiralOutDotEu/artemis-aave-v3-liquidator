[package]
name = "bot-config"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
schemars = { version = "0.8", features = ["derive"] }
ethers = { version = "2", features = ["rustls"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
